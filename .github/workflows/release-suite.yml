# Release E2E suite (#416 stage 3; retargeted #451).
#
# Applies the fixture suite, waits for MergeWatch to review each PR, grades the
# run deterministically, and tears down. Manual dispatch accepts a tag or mode
# so an impacted subset can be run on demand without waiting for the night.
#
# This opens REAL pull requests and spends REAL LLM budget, which is why it is
# NOT scheduled and NOT per-push.
#
# It ran nightly until #451. That was removed rather than repaired: it had been
# failing every night for weeks — no git identity, so fixture 1 died and every
# fixture after it hit "Working tree has uncommitted changes" — and nobody
# noticed, because nothing reported the result. A recurring job that fails
# unwatched is worse than no job: it looks like coverage.
#
# It now runs where the answer is actually wanted: when a release is cut, and
# on demand before cutting one. The deploy gate already covers each merge with
# the IMPACTED subset; this is the full graded set, once, against what ships.
name: Release E2E suite

on:
  # No `push: tags: v*` trigger any more.
  #
  # It used to fire when a release tag appeared, which validated a release that
  # ALREADY EXISTED — if the suite failed, the tag and the published images were
  # already out. mergewatch.ai's `release-gate.yml` (#505) inverted that: it runs
  # this same graded set BEFORE the tag is cut, and creates the tag only after a
  # human has signed off on the manual fixtures.
  #
  # Leaving this trigger in place would also mean the gate's own tag re-ran the
  # whole suite a second time, immediately, against itself — and in a different
  # concurrency group from the gate that just finished (#506).
  #
  # Kept dispatchable: running an impacted subset on demand is still useful.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Only fixtures with this tag (e.g. agents, billing, oss)'
        required: false
        type: string
      mode:
        description: 'Only fixtures with this MODE (pr, dynamo, dashboard, mcp)'
        required: false
        type: string
      dry_run:
        description: 'Print the selection and stop — opens no PRs'
        required: false
        default: false
        type: boolean

# Never let two suite runs overlap: they share fixture branches and would
# clobber each other's PRs.
concurrency:
  group: e2e-suite
  cancel-in-progress: false

jobs:
  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configure git identity
        run: |
          # run-suite commits each fixture overlay, and a fresh runner has no
          # identity. Without this the FIRST fixture dies with "empty ident
          # name" (exit 128) and every one after it hits "Working tree has
          # uncommitted changes" — which is exactly how this workflow has been
          # failing, unnoticed, every night.
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Resolve selection
        id: select
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Through the environment, never interpolated into the script body:
          # `${{ }}` of a dispatch input is substituted as TEXT before bash
          # sees it, which is a command-injection hole in a job holding a
          # write-scoped token.
          IN_TAG: ${{ inputs.tag }}
          IN_MODE: ${{ inputs.mode }}
        run: |
          ARGS=()
          if [ -n "${IN_TAG:-}" ] || [ -n "${IN_MODE:-}" ]; then
            [ -n "${IN_TAG:-}" ]  && ARGS+=(--tag "$IN_TAG")
            [ -n "${IN_MODE:-}" ] && ARGS+=(--mode "$IN_MODE")
          else
            # Default: the same set the deploy gate runs. An unfiltered nightly
            # applied all 98 fixtures — 98 real PRs and 98 real LLM reviews —
            # to assert whatever happened to be graded among them. This runs
            # the fixtures that can actually fail, and nothing else.
            ARGS+=(--tag correctness --automated --graded)
          fi
          printf '%s\n' "${ARGS[@]}" > /tmp/select-args.txt
          scripts/select-fixtures.sh "${ARGS[@]}" | tee /tmp/selection.txt
          echo "count=$(grep -c . /tmp/selection.txt || true)" >> "$GITHUB_OUTPUT"
          echo "args=${ARGS[*]}" >> "$GITHUB_OUTPUT"

      - name: Dry run
        if: ${{ inputs.dry_run }}
        env:
          COUNT: ${{ steps.select.outputs.count }}
        run: |
          echo "Selection ($COUNT fixtures), nothing applied:"
          cat /tmp/selection.txt

      - name: Apply suite
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pace the run so MergeWatch is not reviewing 98 PRs at once — the
          # review agent's own concurrency cap would throttle and park them.
          SLEEP: '20'
        run: |
          # xargs from the file, so an arg never round-trips through a shell
          # expansion of a workflow expression.
          xargs -a /tmp/select-args.txt scripts/run-suite.sh

      - name: Restore the tooling checkout
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # run-suite leaves the repo on the LAST fixture branch, cut from the
          # e2e-baseline tag — which predates grade-run.mjs, await-reviews.mjs
          # and every expect.json. `git checkout main` does not help either:
          # reset-env.sh moves the local main pointer to the baseline too.
          # origin/main is the one ref nothing here rewrites.
          git fetch --quiet origin main
          git checkout -f --detach origin/main
          test -f scripts/grade-run.mjs     || { echo "::error::grade-run.mjs missing"; exit 1; }
          test -f scripts/await-reviews.mjs || { echo "::error::await-reviews.mjs missing"; exit 1; }
          n=$(ls fixtures/*/expect.json 2>/dev/null | wc -l)
          [ "$n" -gt 0 ] || { echo "::error::no expect.json — every fixture would grade UNGRADED and pass"; exit 1; }
          echo "restored $n expect.json file(s)"

      - name: Wait for every review to complete
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Was `sleep 300`. A timer cannot tell "the review is still working"
          # from "the review never started", and grading either early reports a
          # missing comment as a product failure.
          scripts/await-reviews.mjs --timeout 1800

      - name: Grade deterministically
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/grade-run.mjs

      - name: Upload run artifacts
        if: ${{ always() && !inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-run
          path: .e2e/
          if-no-files-found: warn

      - name: Tear down
        # Always: a failed grade must still close the PRs it opened, or the next
        # run starts against a repo full of stale fixture branches.
        if: ${{ always() && !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/reset-env.sh || echo "teardown failed — check for stale fixture branches"
