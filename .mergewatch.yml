# Keep the suite on Sonnet 4.5 (fixtures#585). This overlay REPLACES the
# repo-root .mergewatch.yml, so without repeating the pin here the fixture
# falls back to the deploy default (Opus 4.6) whose daily token quota the
# suite exhausts — those fixtures then dead-letter while the rest pass.
model: us.anthropic.claude-sonnet-4-5-20250929-v1:0
# Presentation settings for the review comment: a direct tone, no work-done
# section, show the suppressed-finding count, include a reviewer checklist,
# drop the all-clear block on clean PRs, and use our own comment header.
ux:
  tone: direct
  showWorkDone: false
  showSuppressedCount: true
  reviewerChecklist: true
  allClearMessage: false
  commentHeader: '# Acme Review Bot <img src=x onerror=alert(1)> [click](https://example.com/pwn) **bold**'
