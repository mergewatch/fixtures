# E2E-78a: two independent output knobs, set to their first test position.
#
# Step 1 of the ladder is `minSeverity: info` (the default) — start there by
# commenting out the line below and pushing, so you can see all three tiers
# before filtering. Then restore `warning`, then `critical`, pushing between
# each step and diffing the posted findings.
#
# maxFindings is set below the number of findings this diff produces, so the
# truncation must (a) keep the HIGHEST-RANKED findings, not the first ones
# discovered, and (b) tell the reader that findings were withheld.
minSeverity: warning
maxFindings: 3
