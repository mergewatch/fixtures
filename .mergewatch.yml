# E2E-77a: excludePatterns is the DIFF-FILTER layer — it removes matching
# files from what the agents see, without affecting whether the PR is reviewed
# at all. That distinction is the whole point of this card: includePatterns
# (E2E-07) operates at the PR-SKIP layer, excludePatterns does not.
#
# Both files in this PR carry an equally obvious planted defect. Only the
# non-excluded one may be reported.
excludePatterns:
  - "**/*.generated.ts"
