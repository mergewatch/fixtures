# E2E-81: let agents request files beyond the diff, but bound how much they
# can pull. The budget exists so a curious agent cannot drag an unbounded
# slice of the repository into the prompt.
#
# src/utils.ts is NOT in this PR's diff, but the changed caller's correctness
# depends entirely on it. With awareness on, the agent should fetch it and
# reason from the real signatures. With awareness off, it must say it cannot
# see them — not guess.
codebaseAwareness: true
maxFileRequestRounds: 1
maxContextKB: 32
