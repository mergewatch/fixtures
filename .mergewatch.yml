# Keep the suite on Sonnet 4.5 (fixtures#585). This overlay REPLACES the
# repo-root .mergewatch.yml, so without repeating the pin here the fixture
# falls back to the deploy default (Opus 4.6) whose daily token quota the
# suite exhausts — those fixtures then dead-letter while the rest pass.
model: us.anthropic.claude-sonnet-4-5-20250929-v1:0
# Don't post an "all clear" summary comment on clean PRs — the check run still
# reports the passing conclusion and merge score, so nothing is lost. This
# keeps high-volume PR queues from filling up with empty summaries.
postSummaryOnClean: false
# Drop warnings and info before grounding (mergewatch.ai#660). This fixture tests
# the silence, and a single built-in test-coverage warning broke it (fixtures
# #3764). Criticals and the seeded no-todo org agent still post the summary.
minSeverity: critical
