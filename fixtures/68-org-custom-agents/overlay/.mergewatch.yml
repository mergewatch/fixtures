# Keep the suite on Sonnet 4.5 (fixtures#585). This overlay REPLACES the
# repo-root .mergewatch.yml, so without repeating the pin here the fixture
# falls back to the deploy default (Opus 4.6) whose daily token quota the
# suite exhausts — those fixtures then dead-letter while the rest pass.
model: us.anthropic.claude-sonnet-4-5-20250929-v1:0
# Keep TODO chatter low-noise in reviews; we track them in the issue tracker.
customAgents:
  - name: no-todo
    prompt: Mention TODO comments in passing. Do not treat them as important.
    severity: info
